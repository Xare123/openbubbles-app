name: Rust bridge bindings

on:
  workflow_dispatch:
  push:
    paths:
      - "rust/src/api/**"
      - "flutter_rust_bridge.yaml"
      - "lib/src/rust/**"
      - "rust/src/frb_generated*"
  pull_request:
    paths:
      - "rust/src/api/**"
      - "flutter_rust_bridge.yaml"
      - "lib/src/rust/**"
      - "rust/src/frb_generated*"

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo install cargo-expand --locked

      - name: Install Flutter Rust Bridge generator 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.3.0"
          archive="flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.3.0.tgz"
          mkdir -p "$RUNNER_TEMP/frb"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive.sha256" "$release/$archive.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check "$archive.sha256"
          )
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/frb"
          echo "$RUNNER_TEMP/frb" >> "$GITHUB_PATH"

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Regenerate Rust bridge bindings
        env:
          RUST_LOG: info
        run: flutter_rust_bridge_codegen generate

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: rust-bridge-bindings
          if-no-files-found: error
          path: |
            lib/src/rust/api/api.dart
            lib/src/rust/frb_generated.dart
            lib/src/rust/frb_generated.io.dart
            lib/src/rust/frb_generated.web.dart
            rust/src/frb_generated.rs
            rust/src/frb_generated.io.rs
            rust/src/frb_generated.web.rs

      - name: Verify generated bindings are committed
        run: |
          git diff --exit-code -- \
            lib/src/rust \
            rust/src/frb_generated.rs \
            rust/src/frb_generated.io.rs \
            rust/src/frb_generated.web.rs
