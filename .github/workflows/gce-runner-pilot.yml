name: GCE runner pilot

on:
  workflow_dispatch:
    inputs:
      machine_type:
        description: Google Compute Engine machine type
        required: true
        default: n2d-standard-16
        type: choice
        options:
          - n2d-standard-16
          - n2d-standard-8
          - t2d-standard-32
          - t2d-standard-60
          - c4d-highcpu-16
      source_ref:
        description: Full 40-character source commit SHA to build and verify
        required: true
        default: 69bce2aa22cd1505d3c404d09b5a035a653ffe9e
        type: string
      flavor:
        description: Non-production Android flavor to build
        required: true
        default: beta
        type: choice
        options:
          - beta
          - canary
      validation_mode:
        description: Validation scope for this ephemeral source-only run
        required: true
        default: full
        type: choice
        options:
          - full
          - build-only
          - bindings-only
          - rustpush-only
permissions:
  contents: read

# Do not cancel a running pilot. GitHub cancellation can interrupt cleanup;
# the fixed VM lifetime below is the independent billing backstop.
concurrency:
  group: gce-runner-pilot
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
  GCP_RUNNER_SERVICE_ACCOUNT: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
  GCP_RUNNER_NETWORK: ${{ vars.GCP_RUNNER_NETWORK }}
  GCP_RUNNER_SUBNET: ${{ vars.GCP_RUNNER_SUBNET }}
  GCP_RUNNER_ZONE: us-west1-b
  RUNNER_NAME: gce-${{ github.run_id }}-${{ github.run_attempt }}
  MACHINE_TYPE: ${{ inputs.machine_type || 'n2d-standard-16' }}
  DISK_TYPE: ${{ startsWith(inputs.machine_type || 'n2d-standard-16', 'c4d-') && 'hyperdisk-balanced' || startsWith(inputs.machine_type || 'n2d-standard-16', 't2d-') && 'pd-ssd' || 'pd-balanced' }}
  BUILD_FLAVOR: ${{ inputs.flavor || 'beta' }}
  VALIDATION_MODE: ${{ inputs.validation_mode || 'full' }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  TRUSTED_SOURCE_BRANCH: agent/cloudkit-v2-auth-refresh-repair

jobs:
  create-runner:
    name: Create ephemeral Google Cloud runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      label: ${{ steps.create.outputs.label }}
      zone: ${{ steps.create.outputs.zone }}
    steps:
      - name: Validate configuration
        shell: bash
        env:
          GCE_RUNNER_PAT: ${{ secrets.GCE_RUNNER_PAT }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_WIF_PROVIDER
            GCP_WIF_SERVICE_ACCOUNT
            GCP_RUNNER_SERVICE_ACCOUNT
            GCP_RUNNER_NETWORK
            GCP_RUNNER_SUBNET
            GCE_RUNNER_PAT
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub variables/secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_ref must be a lowercase full 40-character commit SHA.' >&2
            exit 1
          fi
          trusted_sha="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${TRUSTED_SOURCE_BRANCH}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve trusted branch: $TRUSTED_SOURCE_BRANCH" >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" != "$trusted_sha" ]]; then
            echo "source_ref is not the current trusted branch head." >&2
            echo "Expected $trusted_sha from $TRUSTED_SOURCE_BRANCH." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Create runner
        id: create
        uses: Cyclenerd/gce-github-runner@8e525f1156c9afac023a943187c844c8e03fe6a7 # v1.1.0
        with:
          mode: create
          github_token: ${{ secrets.GCE_RUNNER_PAT }}
          project: ${{ env.GCP_PROJECT_ID }}
          name: ${{ env.RUNNER_NAME }}
          zone: ${{ env.GCP_RUNNER_ZONE }}
          machine_type: ${{ env.MACHINE_TYPE }}
          disk_size: "100"
          disk_type: ${{ env.DISK_TYPE }}
          image_family: ubuntu-2404-lts-amd64
          image_project: ubuntu-os-cloud
          max_run_duration: 75m
          network: ${{ env.GCP_RUNNER_NETWORK }}
          subnet: ${{ env.GCP_RUNNER_SUBNET }}
          service_account: ${{ env.GCP_RUNNER_SERVICE_ACCOUNT }}
          scopes: cloud-platform

      - name: Record runner configuration
        shell: bash
        run: |
          {
            echo '### Ephemeral runner'
            echo
            echo "- Name: \`${RUNNER_NAME}\`"
            echo "- Zone: \`${{ steps.create.outputs.zone }}\`"
            echo "- Machine: \`${MACHINE_TYPE}\`"
            echo "- Disk: \`${DISK_TYPE}\`"
            echo '- Maximum VM lifetime: `75m`'
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark-build:
    name: Build ${{ inputs.flavor || 'beta' }} APK on GCE
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 60
    # The Marketplace action starts the runner service without HOME. Several
    # setup actions require it, and Rust otherwise falls back to /.cargo.
    env:
      HOME: /root
      CARGO_HOME: /root/.cargo
    permissions:
      contents: read
    steps:
      - name: Report runner hardware
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          free -h
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            unzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Verify checked-out source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_REF" ]]; then
            echo "Checked out $actual, expected $SOURCE_REF" >&2
            exit 1
          fi
          echo "Source SHA verified: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Set up Flutter
        if: ${{ env.VALIDATION_MODE != 'rustpush-only' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Trust Flutter SDK checkout
        if: ${{ env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Set up Java
        if: ${{ env.VALIDATION_MODE != 'rustpush-only' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        if: ${{ env.VALIDATION_MODE != 'rustpush-only' }}
        uses: amyu/setup-android@3fe49086b1abd7c9ef865120d5d4d486fe55ba98 # v5

      - name: Cache Cargo registries
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cloudkit-canary-cargo-v1-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rustpush/Cargo.toml', 'rustpush/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cloudkit-canary-cargo-v1-

      # Cargo validates incremental fingerprints after a source-only restore.
      # Keep the compatibility family aligned with the active sampler job.
      - name: Cache ARM64 debug CargoKit output
        if: ${{ env.VALIDATION_MODE != 'rustpush-only' }}
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/app/build/build
          key: ${{ runner.os }}-cloudkit-canary-cargokit-v2-${{ hashFiles('pubspec.lock', 'rust/Cargo.toml', 'rust/Cargo.lock', 'rustpush/Cargo.toml', 'rustpush/Cargo.lock', 'android/**/*.gradle*', 'android/**/gradle.properties', 'rust_builder/cargokit/**', 'tooling/android/patch_pub_cache_cargokit.sh') }}-${{ hashFiles('rust/**/*.rs', 'rustpush/**/*.rs', 'rust/build.rs', 'rustpush/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cloudkit-canary-cargokit-v2-${{ hashFiles('pubspec.lock', 'rust/Cargo.toml', 'rust/Cargo.lock', 'rustpush/Cargo.toml', 'rustpush/Cargo.lock', 'android/**/*.gradle*', 'android/**/gradle.properties', 'rust_builder/cargokit/**', 'tooling/android/patch_pub_cache_cargokit.sh') }}-

      - name: Install pinned Android SDK components
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' >/dev/null

      - name: Set up fake Fairplay keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            4056631661436364584235346952193
            4056631661436364584235346952194
            4056631661436364584235346952195
            4056631661436364584235346952196
            4056631661436364584235346952197
            4056631661436364584235346952198
            4056631661436364584235346952199
            4056631661436364584235346952200
            4056631661436364584235346952201
            4056631661436364584235346952208
          )
          for name in "${cert_names[@]}"; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem "rustpush/certs/fairplay/$name.pem"
            cp rustpush/certs/legacy-fairplay/fairplay.crt "rustpush/certs/fairplay/$name.crt"
          done

      - name: Patch vendored CargoKit for Flutter 3.44.8
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          bash ./tooling/android/patch_pub_cache_cargokit.sh

      - name: Install pinned Gradle
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        env:
          GRADLE_VERSION: 8.9
          GRADLE_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
        run: |
          set -euo pipefail
          pinned="$(sed -n 's|^distributionUrl=.*/gradle-\([0-9.]*\)-bin\.zip$|\1|p' \
            android/gradle/wrapper/gradle-wrapper.properties)"
          if [[ "$pinned" != "$GRADLE_VERSION" ]]; then
            echo "wrapper pins Gradle $pinned but this step installs $GRADLE_VERSION" >&2
            exit 1
          fi
          archive="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL -o "$archive" \
            "https://services.gradle.org/distributions/${archive}"
          echo "${GRADLE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Full mode is the production-readiness gate. The ObjectBox C archive is
      # pinned to the same version and checksum as build.yml so the Dart suite
      # exercises the real ObjectBox-backed Cloud Sync tests on the VM.
      - name: Install pinned ObjectBox C library
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        env:
          OBJECTBOX_VERSION: 5.3.2
          OBJECTBOX_SHA256: 6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613
        run: |
          set -euo pipefail
          pinned="$(grep -oP '^\s{2}objectbox:\s*\K\d+\.\d+\.\d+' pubspec.yaml)"
          if [[ "$pinned" != "$OBJECTBOX_VERSION" ]]; then
            echo "pubspec pins objectbox $pinned but this step installs $OBJECTBOX_VERSION" >&2
            exit 1
          fi
          archive="objectbox-linux-x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/objectbox/objectbox-c/releases/download/v${OBJECTBOX_VERSION}/${archive}"
          echo "${OBJECTBOX_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/objectbox"
          tar -xzf "$archive" -C "$RUNNER_TEMP/objectbox"
          library="$(find "$RUNNER_TEMP/objectbox" -name libobjectbox.so -print -quit)"
          if [[ -z "$library" ]]; then
            echo "libobjectbox.so was not present in $archive" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$(dirname "$library")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Ensure PowerShell is available for binding normalization
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            pwsh --version
            exit 0
          fi
          sudo snap install powershell --classic
          pwsh --version

      - name: Install pinned Flutter Rust Bridge generator
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/flutter_rust_bridge_codegen.tgz"
          url="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.3.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.3.0.tgz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "bb3a5e3d1f17a543e73f8dfff886e883928b95e3a9d19ca5268da40952d80cee  $archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/frb-codegen"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/frb-codegen"
          echo "${RUNNER_TEMP}/frb-codegen" >> "$GITHUB_PATH"

      - name: Regenerate committed bridge bindings
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      - name: Normalize generated SSE implementations
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: pwsh
        run: |
          ./tooling/frb/guard_generated_sse_impls.ps1 -Mode Deduplicate -ExpectedRemovalCount 6
          ./tooling/frb/guard_generated_sse_impls.ps1 -Mode Verify

      # The artifact is retained even if regeneration changes committed files.
      # Drift is recorded here and rejected after the requested validation has
      # produced its artifacts, so a failed reproducibility gate never hides
      # the generated files needed to review the change.
      - name: Check generated bridge bindings for drift
        id: binding-drift
        if: ${{ always() && (env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only') }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/src/rust/api/api.dart
            lib/src/rust/frb_generated.dart
            lib/src/rust/frb_generated.io.dart
            lib/src/rust/frb_generated.web.dart
            rust/src/frb_generated.rs
            rust/src/frb_generated.io.rs
            rust/src/frb_generated.web.rs
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'Generated bridge bindings are reproducible.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo 'Generated bridge binding drift detected.' >&2
            git diff --stat -- "${files[@]}" >&2
            git diff --name-only -- "${files[@]}" >&2
            {
              echo '### Generated bridge binding drift'
              echo
              echo 'Regeneration changed committed binding files. The files are uploaded for review; this run will fail its reproducibility gate.'
              echo
              git diff --stat -- "${files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check generated Rust bridge
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: cargo check --manifest-path rust/Cargo.toml --lib --message-format short

      # Generate bindings before compiling Dart or Rust tests. A source change
      # that legitimately adds a bridge API must be tested against its newly
      # generated surface, while the later drift gate still prevents silently
      # accepting uncommitted generated files.
      - name: Run the full Dart test suite
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: flutter test

      - name: Run Rust library tests
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --lib

      - name: Run rustpush library tests with production feature set
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        # Several tests intentionally pause a process-global CloudKit gate.
        run: cargo test --manifest-path rustpush/Cargo.toml --lib --features remote-anisette-v3 -- --test-threads=1

      - name: Run Cloud Sync protector harness
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: cargo test --manifest-path rust/cloud_sync_protector_harness/Cargo.toml

      - name: Upload regenerated bridge bindings
        if: ${{ always() && (env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GCE regenerated bridge bindings (${{ env.VALIDATION_MODE }})
          if-no-files-found: error
          retention-days: 7
          path: |
            lib/src/rust/api/api.dart
            lib/src/rust/frb_generated.dart
            lib/src/rust/frb_generated.io.dart
            lib/src/rust/frb_generated.web.dart
            rust/src/frb_generated.rs
            rust/src/frb_generated.io.rs
            rust/src/frb_generated.web.rs

      - name: Build benchmark APK
        id: build
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          build_args=(
            build apk
            --flavor "$BUILD_FLAVOR"
            --debug
            --target-platform android-arm64
            --dart-define=OPENBUBBLES_CLOUD_SYNC_V2_SAMPLER=true
            --dart-define=OPENBUBBLES_CLOUD_SYNC_V2_SEMANTIC_PULL=true
            --dart-define=OPENBUBBLES_BUILD_COMMIT="$(git rev-parse HEAD)"
          )
          if [[ "$BUILD_FLAVOR" == 'canary' ]]; then
            build_args+=(--dart-define=OPENBUBBLES_CLOUD_SYNC_V2_EVIDENCE=true)
          fi
          flutter "${build_args[@]}"
          finished="$(date +%s)"
          elapsed="$((finished - started))"
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo '### Build benchmark'
            echo
            echo "- Flavor: \`${BUILD_FLAVOR}\`"
            echo "- Machine: \`${MACHINE_TYPE}\`"
            echo "- Flutter build time: \`${elapsed}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify producer APK identity and native libraries
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-${BUILD_FLAVOR}-debug.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt"
          application_id="$(
            "$aapt" dump badging "$apk" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          expected_application_id='com.bluebubbles.messaging.beta'
          if [[ "$BUILD_FLAVOR" == 'canary' ]]; then
            expected_application_id='com.bluebubbles.messaging.cloudkitcanary'
          fi
          if [[ "$application_id" != "$expected_application_id" ]]; then
            echo "Unexpected $BUILD_FLAVOR application ID: $application_id" >&2
            exit 1
          fi
          for entry in \
            lib/arm64-v8a/libflutter.so \
            lib/arm64-v8a/librust_lib_bluebubbles.so \
            lib/arm64-v8a/libirondash_engine_context_native.so \
            lib/arm64-v8a/libsuper_native_extensions.so; do
            if ! unzip -l "$apk" | grep -q "$entry"; then
              echo "$apk is missing $entry" >&2
              unzip -l "$apk" | grep 'lib/' >&2 || true
              exit 1
            fi
          done

      - name: Upload benchmark APK
        id: upload-apk
        if: ${{ env.VALIDATION_MODE != 'bindings-only' && env.VALIDATION_MODE != 'rustpush-only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GCE producer ${{ inputs.flavor || 'beta' }} APK ${{ env.SOURCE_REF }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.flavor || 'beta' }}-debug.apk
          if-no-files-found: error

      - name: Fail on generated bridge drift
        if: ${{ steps.binding-drift.outputs.drift == 'true' }}
        shell: bash
        run: |
          echo 'Generated bridge bindings are not reproducible from the committed source.' >&2
          echo 'Review the uploaded binding artifact and commit the intended generated output before relying on this gate.' >&2
          exit 1

      - name: Run rustpush-only validation
        if: ${{ env.VALIDATION_MODE == 'rustpush-only' }}
        shell: bash
        run: cargo test --manifest-path rustpush/Cargo.toml --lib --features remote-anisette-v3 -- --test-threads=1

  finalize-canary:
    name: Sign and verify Canary on GitHub-hosted runner
    needs: benchmark-build
    if: >-
      ${{
        needs.benchmark-build.result == 'success' &&
        (inputs.flavor || 'beta') == 'canary' &&
        (inputs.validation_mode || 'full') != 'bindings-only' &&
        (inputs.validation_mode || 'full') != 'rustpush-only'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: amyu/setup-android@3fe49086b1abd7c9ef865120d5d4d486fe55ba98 # v5

      - name: Install pinned Android build tools
        shell: bash
        run: sdkmanager 'build-tools;36.0.0' >/dev/null

      - name: Download GCE producer APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: GCE producer canary APK ${{ env.SOURCE_REF }}
          path: producer

      - name: Sign and verify Canary
        env:
          CANARY_KEYSTORE_BASE64: ${{ secrets.CANARY_KEYSTORE_BASE64 }}
          CANARY_KEYSTORE_PASSWORD: ${{ secrets.CANARY_KEYSTORE_PASSWORD }}
          CANARY_KEY_PASSWORD: ${{ secrets.CANARY_KEY_PASSWORD }}
          CANARY_KEY_ALIAS: ${{ secrets.CANARY_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          apk='producer/app-canary-debug.apk'
          keystore="$RUNNER_TEMP/cloudkit-canary.p12"
          signed_apk="$RUNNER_TEMP/app-canary-debug-signed.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"

          test -f "$apk"
          test -x "$aapt"
          test -x "$apksigner"
          test -n "$CANARY_KEYSTORE_BASE64"
          test -n "$CANARY_KEYSTORE_PASSWORD"
          test -n "$CANARY_KEY_PASSWORD"
          test -n "$CANARY_KEY_ALIAS"

          application_id="$(
            "$aapt" dump badging "$apk" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          if [[ "$application_id" != 'com.bluebubbles.messaging.cloudkitcanary' ]]; then
            echo "Unexpected producer application ID: $application_id" >&2
            exit 1
          fi
          for entry in \
            lib/arm64-v8a/libflutter.so \
            lib/arm64-v8a/librust_lib_bluebubbles.so \
            lib/arm64-v8a/libirondash_engine_context_native.so \
            lib/arm64-v8a/libsuper_native_extensions.so; do
            if ! unzip -l "$apk" | grep -q "$entry"; then
              echo "Producer APK is missing $entry" >&2
              exit 1
            fi
          done

          printf '%s' "$CANARY_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$CANARY_KEY_ALIAS" \
            --ks-pass env:CANARY_KEYSTORE_PASSWORD \
            --key-pass env:CANARY_KEY_PASSWORD \
            --out "$signed_apk" \
            "$apk"
          mv "$signed_apk" "$apk"

          actual_fingerprint="$(
            "$apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          expected_fingerprint='0ea17c1b67581ca79660d33db45af0a36b71ea36a4cbafec5293d3ae80570d79'
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Unexpected Canary signing certificate: $actual_fingerprint" >&2
            exit 1
          fi
          signature_report="$("$apksigner" verify --verbose "$apk")"
          if ! grep -Eq '^Verified using v2 scheme.*: true$' <<< "$signature_report"; then
            echo 'Canary APK is not signed with APK Signature Scheme v2' >&2
            exit 1
          fi

      - name: Upload signed Canary APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GCE CloudKit V2 Evidence Canary APK ${{ env.SOURCE_REF }}
          path: producer/app-canary-debug.apk
          if-no-files-found: error

  delete-runner:
    name: Delete Google Cloud runner
    needs:
      - create-runner
      - benchmark-build
    if: ${{ always() && needs.create-runner.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Delete runner through Marketplace action
        continue-on-error: true
        uses: Cyclenerd/gce-github-runner@8e525f1156c9afac023a943187c844c8e03fe6a7 # v1.1.0
        with:
          mode: delete
          github_token: ${{ secrets.GCE_RUNNER_PAT }}
          project: ${{ env.GCP_PROJECT_ID }}
          name: ${{ env.RUNNER_NAME }}
          zone: ${{ env.GCP_RUNNER_ZONE }}

      - name: Idempotent cleanup and verification
        shell: bash
        env:
          GCE_RUNNER_PAT: ${{ secrets.GCE_RUNNER_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gcloud compute instances describe "$RUNNER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_RUNNER_ZONE" \
            --format='value(name)' >/dev/null 2>&1; then
            gcloud compute instances delete "$RUNNER_NAME" \
              --project "$GCP_PROJECT_ID" \
              --zone "$GCP_RUNNER_ZONE" \
              --quiet
          fi

          list_matching_runner_ids() {
            local page=1
            local count response
            while :; do
              response="$(mktemp)"
              curl --fail --silent --show-error --location \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GCE_RUNNER_PAT" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GH_REPOSITORY/actions/runners?per_page=100&page=$page" \
                -o "$response"
              jq -r --arg name "$RUNNER_NAME" \
                '.runners[] | select(.name == $name) | .id' "$response"
              count="$(jq -er '.runners | length' "$response")"
              rm -f "$response"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
            done
          }

          mapfile -t runner_ids < <(list_matching_runner_ids)
          for runner_id in "${runner_ids[@]}"; do
            curl --fail --silent --show-error --location \
              -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GCE_RUNNER_PAT" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runners/$runner_id"
          done

          if gcloud compute instances describe "$RUNNER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_RUNNER_ZONE" \
            --format='value(name)' >/dev/null 2>&1; then
            echo "Runner VM still exists: $RUNNER_NAME" >&2
            exit 1
          fi

          remaining=''
          for attempt in 1 2 3 4 5 6; do
            remaining="$(list_matching_runner_ids)"
            if [[ -z "$remaining" ]]; then
              break
            fi
            echo "Runner registration still visible; retrying verification (${attempt}/6)."
            sleep 5
          done
          if [[ -n "$remaining" ]]; then
            echo "Runner registration still exists after paginated cleanup: $RUNNER_NAME" >&2
            exit 1
          fi

          echo 'Runner VM and GitHub registration are absent.' >> "$GITHUB_STEP_SUMMARY"
