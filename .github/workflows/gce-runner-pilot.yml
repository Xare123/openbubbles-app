name: GCE runner pilot

on:
  workflow_dispatch:
    inputs:
      machine_type:
        description: Google Compute Engine machine type
        required: true
        default: n2d-standard-16
        type: choice
        options:
          - n2d-standard-16
          - n2d-standard-8
          - c4d-highcpu-16
      source_ref:
        description: Trusted branch or commit to build
        required: true
        default: agent/cloudkit-v2-checkpoint-repair
        type: string
      flavor:
        description: Non-production Android flavor to benchmark
        required: true
        default: beta
        type: choice
        options:
          - beta
      validation_mode:
        description: Validation scope for this ephemeral source-only run
        required: true
        default: full
        type: choice
        options:
          - full
          - build-only
          - bindings-only
permissions:
  contents: read

# Do not cancel a running pilot. GitHub cancellation can interrupt cleanup;
# the fixed VM lifetime below is the independent billing backstop.
concurrency:
  group: gce-runner-pilot-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
  GCP_RUNNER_SERVICE_ACCOUNT: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
  GCP_RUNNER_NETWORK: ${{ vars.GCP_RUNNER_NETWORK }}
  GCP_RUNNER_SUBNET: ${{ vars.GCP_RUNNER_SUBNET }}
  GCP_RUNNER_ZONE: us-west1-b
  RUNNER_NAME: gce-${{ github.run_id }}-${{ github.run_attempt }}
  MACHINE_TYPE: ${{ inputs.machine_type || 'n2d-standard-16' }}
  DISK_TYPE: ${{ startsWith(inputs.machine_type || 'n2d-standard-16', 'c4d-') && 'hyperdisk-balanced' || 'pd-balanced' }}
  BUILD_FLAVOR: ${{ inputs.flavor || 'beta' }}
  VALIDATION_MODE: ${{ inputs.validation_mode || 'full' }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  create-runner:
    name: Create ephemeral Google Cloud runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      label: ${{ steps.create.outputs.label }}
      zone: ${{ steps.create.outputs.zone }}
    steps:
      - name: Validate configuration
        shell: bash
        env:
          GCE_RUNNER_PAT: ${{ secrets.GCE_RUNNER_PAT }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_WIF_PROVIDER
            GCP_WIF_SERVICE_ACCOUNT
            GCP_RUNNER_SERVICE_ACCOUNT
            GCP_RUNNER_NETWORK
            GCP_RUNNER_SUBNET
            GCE_RUNNER_PAT
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub variables/secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            echo 'source_ref must be a branch, tag, or full 40-character commit SHA.' >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Create runner
        id: create
        uses: Cyclenerd/gce-github-runner@8e525f1156c9afac023a943187c844c8e03fe6a7 # v1.1.0
        with:
          mode: create
          github_token: ${{ secrets.GCE_RUNNER_PAT }}
          project: ${{ env.GCP_PROJECT_ID }}
          name: ${{ env.RUNNER_NAME }}
          zone: ${{ env.GCP_RUNNER_ZONE }}
          machine_type: ${{ env.MACHINE_TYPE }}
          disk_size: "100"
          disk_type: ${{ env.DISK_TYPE }}
          image_family: ubuntu-2404-lts-amd64
          image_project: ubuntu-os-cloud
          max_run_duration: 75m
          network: ${{ env.GCP_RUNNER_NETWORK }}
          subnet: ${{ env.GCP_RUNNER_SUBNET }}
          service_account: ${{ env.GCP_RUNNER_SERVICE_ACCOUNT }}
          scopes: cloud-platform

      - name: Record runner configuration
        shell: bash
        run: |
          {
            echo '### Ephemeral runner'
            echo
            echo "- Name: \`${RUNNER_NAME}\`"
            echo "- Zone: \`${{ steps.create.outputs.zone }}\`"
            echo "- Machine: \`${MACHINE_TYPE}\`"
            echo "- Disk: \`${DISK_TYPE}\`"
            echo '- Maximum VM lifetime: `75m`'
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark-build:
    name: Build ${{ inputs.flavor || 'beta' }} APK on GCE
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 60
    # The Marketplace action starts the runner service without HOME. Several
    # setup actions require it, and Rust otherwise falls back to /.cargo.
    env:
      HOME: /root
      CARGO_HOME: /root/.cargo
    permissions:
      contents: read
    steps:
      - name: Report runner hardware
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          free -h
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            unzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: amyu/setup-android@3fe49086b1abd7c9ef865120d5d4d486fe55ba98 # v5

      - name: Install pinned Android SDK components
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' >/dev/null

      - name: Set up fake Fairplay keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            4056631661436364584235346952193
            4056631661436364584235346952194
            4056631661436364584235346952195
            4056631661436364584235346952196
            4056631661436364584235346952197
            4056631661436364584235346952198
            4056631661436364584235346952199
            4056631661436364584235346952200
            4056631661436364584235346952201
            4056631661436364584235346952208
          )
          for name in "${cert_names[@]}"; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem "rustpush/certs/fairplay/$name.pem"
            cp rustpush/certs/legacy-fairplay/fairplay.crt "rustpush/certs/fairplay/$name.crt"
          done

      - name: Patch vendored CargoKit for Flutter 3.44.8
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$FLUTTER_ROOT"
          flutter pub get
          bash ./tooling/android/patch_pub_cache_cargokit.sh

      - name: Install pinned Gradle
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        shell: bash
        env:
          GRADLE_VERSION: 8.9
          GRADLE_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
        run: |
          set -euo pipefail
          pinned="$(sed -n 's|^distributionUrl=.*/gradle-\([0-9.]*\)-bin\.zip$|\1|p' \
            android/gradle/wrapper/gradle-wrapper.properties)"
          if [[ "$pinned" != "$GRADLE_VERSION" ]]; then
            echo "wrapper pins Gradle $pinned but this step installs $GRADLE_VERSION" >&2
            exit 1
          fi
          archive="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL -o "$archive" \
            "https://services.gradle.org/distributions/${archive}"
          echo "${GRADLE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Full mode is the production-readiness gate. The ObjectBox C archive is
      # pinned to the same version and checksum as build.yml so the Dart suite
      # exercises the real ObjectBox-backed Cloud Sync tests on the VM.
      - name: Install pinned ObjectBox C library
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        env:
          OBJECTBOX_VERSION: 5.3.2
          OBJECTBOX_SHA256: 6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613
        run: |
          set -euo pipefail
          pinned="$(grep -oP '^\s{2}objectbox:\s*\K\d+\.\d+\.\d+' pubspec.yaml)"
          if [[ "$pinned" != "$OBJECTBOX_VERSION" ]]; then
            echo "pubspec pins objectbox $pinned but this step installs $OBJECTBOX_VERSION" >&2
            exit 1
          fi
          archive="objectbox-linux-x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/objectbox/objectbox-c/releases/download/v${OBJECTBOX_VERSION}/${archive}"
          echo "${OBJECTBOX_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/objectbox"
          tar -xzf "$archive" -C "$RUNNER_TEMP/objectbox"
          library="$(find "$RUNNER_TEMP/objectbox" -name libobjectbox.so -print -quit)"
          if [[ -z "$library" ]]; then
            echo "libobjectbox.so was not present in $archive" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$(dirname "$library")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Ensure PowerShell is available for binding normalization
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            pwsh --version
            exit 0
          fi
          sudo snap install powershell --classic
          pwsh --version

      - name: Install pinned Flutter Rust Bridge generator
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/flutter_rust_bridge_codegen.tgz"
          url="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.3.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.3.0.tgz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "bb3a5e3d1f17a543e73f8dfff886e883928b95e3a9d19ca5268da40952d80cee  $archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/frb-codegen"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/frb-codegen"
          echo "${RUNNER_TEMP}/frb-codegen" >> "$GITHUB_PATH"

      - name: Regenerate committed bridge bindings
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      - name: Normalize generated SSE implementations
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: pwsh
        run: |
          ./tooling/frb/guard_generated_sse_impls.ps1 -Mode Deduplicate -ExpectedRemovalCount 6
          ./tooling/frb/guard_generated_sse_impls.ps1 -Mode Verify

      # The artifact is retained even if regeneration changes committed files.
      # Drift is recorded here and rejected after the requested validation has
      # produced its artifacts, so a failed reproducibility gate never hides
      # the generated files needed to review the change.
      - name: Check generated bridge bindings for drift
        id: binding-drift
        if: ${{ always() && (env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only') }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/src/rust/api/api.dart
            lib/src/rust/frb_generated.dart
            lib/src/rust/frb_generated.io.dart
            lib/src/rust/frb_generated.web.dart
            rust/src/frb_generated.rs
            rust/src/frb_generated.io.rs
            rust/src/frb_generated.web.rs
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'Generated bridge bindings are reproducible.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo 'Generated bridge binding drift detected.' >&2
            git diff --stat -- "${files[@]}" >&2
            git diff --name-only -- "${files[@]}" >&2
            {
              echo '### Generated bridge binding drift'
              echo
              echo 'Regeneration changed committed binding files. The files are uploaded for review; this run will fail its reproducibility gate.'
              echo
              git diff --stat -- "${files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check generated Rust bridge
        if: ${{ env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only' }}
        shell: bash
        run: cargo check --manifest-path rust/Cargo.toml --lib --message-format short

      # Generate bindings before compiling Dart or Rust tests. A source change
      # that legitimately adds a bridge API must be tested against its newly
      # generated surface, while the later drift gate still prevents silently
      # accepting uncommitted generated files.
      - name: Run the full Dart test suite
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: flutter test

      - name: Run Rust library tests
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --lib

      - name: Run rustpush library tests with production feature set
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: cargo test --manifest-path rustpush/Cargo.toml --lib --features remote-anisette-v3

      - name: Run Cloud Sync protector harness
        if: ${{ env.VALIDATION_MODE == 'full' }}
        shell: bash
        run: cargo test --manifest-path rust/cloud_sync_protector_harness/Cargo.toml

      - name: Upload regenerated bridge bindings
        if: ${{ always() && (env.VALIDATION_MODE == 'full' || env.VALIDATION_MODE == 'bindings-only') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GCE regenerated bridge bindings (${{ env.VALIDATION_MODE }})
          if-no-files-found: error
          retention-days: 7
          path: |
            lib/src/rust/api/api.dart
            lib/src/rust/frb_generated.dart
            lib/src/rust/frb_generated.io.dart
            lib/src/rust/frb_generated.web.dart
            rust/src/frb_generated.rs
            rust/src/frb_generated.io.rs
            rust/src/frb_generated.web.rs

      - name: Build benchmark APK
        id: build
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          flutter build apk \
            --flavor "$BUILD_FLAVOR" \
            --debug \
            --target-platform android-arm64 \
            --dart-define=OPENBUBBLES_CLOUD_SYNC_V2_SAMPLER=true \
            --dart-define=OPENBUBBLES_CLOUD_SYNC_V2_SEMANTIC_PULL=true \
            --dart-define=OPENBUBBLES_BUILD_COMMIT="$(git rev-parse HEAD)"
          finished="$(date +%s)"
          elapsed="$((finished - started))"
          echo "seconds=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo '### Build benchmark'
            echo
            echo "- Flavor: \`${BUILD_FLAVOR}\`"
            echo "- Machine: \`${MACHINE_TYPE}\`"
            echo "- Flutter build time: \`${elapsed}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK native libraries
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-${BUILD_FLAVOR}-debug.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt"
          application_id="$(
            "$aapt" dump badging "$apk" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          if [[ "$application_id" != 'com.bluebubbles.messaging.beta' ]]; then
            echo "Unexpected Beta application ID: $application_id" >&2
            exit 1
          fi
          for entry in \
            lib/arm64-v8a/libflutter.so \
            lib/arm64-v8a/librust_lib_bluebubbles.so \
            lib/arm64-v8a/libirondash_engine_context_native.so \
            lib/arm64-v8a/libsuper_native_extensions.so; do
            if ! unzip -l "$apk" | grep -q "$entry"; then
              echo "$apk is missing $entry" >&2
              unzip -l "$apk" | grep 'lib/' >&2 || true
              exit 1
            fi
          done

      - name: Upload benchmark APK
        if: ${{ env.VALIDATION_MODE != 'bindings-only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GCE ${{ inputs.flavor || 'beta' }} Debug APK
          path: build/app/outputs/flutter-apk/app-${{ inputs.flavor || 'beta' }}-debug.apk
          if-no-files-found: error

      - name: Fail on generated bridge drift
        if: ${{ steps.binding-drift.outputs.drift == 'true' }}
        shell: bash
        run: |
          echo 'Generated bridge bindings are not reproducible from the committed source.' >&2
          echo 'Review the uploaded binding artifact and commit the intended generated output before relying on this gate.' >&2
          exit 1

  delete-runner:
    name: Delete Google Cloud runner
    needs:
      - create-runner
      - benchmark-build
    if: ${{ always() && needs.create-runner.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Delete runner through Marketplace action
        continue-on-error: true
        uses: Cyclenerd/gce-github-runner@8e525f1156c9afac023a943187c844c8e03fe6a7 # v1.1.0
        with:
          mode: delete
          github_token: ${{ secrets.GCE_RUNNER_PAT }}
          project: ${{ env.GCP_PROJECT_ID }}
          name: ${{ env.RUNNER_NAME }}
          zone: ${{ env.GCP_RUNNER_ZONE }}

      - name: Idempotent cleanup and verification
        shell: bash
        env:
          GCE_RUNNER_PAT: ${{ secrets.GCE_RUNNER_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gcloud compute instances describe "$RUNNER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_RUNNER_ZONE" \
            --format='value(name)' >/dev/null 2>&1; then
            gcloud compute instances delete "$RUNNER_NAME" \
              --project "$GCP_PROJECT_ID" \
              --zone "$GCP_RUNNER_ZONE" \
              --quiet
          fi

          runners_json="$(mktemp)"
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GCE_RUNNER_PAT" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/runners?per_page=100" \
            -o "$runners_json"

          mapfile -t runner_ids < <(
            jq -r --arg name "$RUNNER_NAME" '.runners[] | select(.name == $name) | .id' "$runners_json"
          )
          for runner_id in "${runner_ids[@]}"; do
            curl --fail --silent --show-error --location \
              -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GCE_RUNNER_PAT" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runners/$runner_id"
          done

          if gcloud compute instances describe "$RUNNER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_RUNNER_ZONE" \
            --format='value(name)' >/dev/null 2>&1; then
            echo "Runner VM still exists: $RUNNER_NAME" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GCE_RUNNER_PAT" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/runners?per_page=100" \
            | jq -e --arg name "$RUNNER_NAME" '[.runners[] | select(.name == $name)] | length == 0' >/dev/null

          echo 'Runner VM and GitHub registration are absent.' >> "$GITHUB_STEP_SUMMARY"
