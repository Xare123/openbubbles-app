name: Windows FaceTime FindMy fast loop (lane)

on:
  # A push containing only this sidecar registers the workflow from the pilot
  # branch without merging it to the repository's default branch. It does not
  # build application source; the exact-source build remains manual.
  push:
    branches:
      - agent/facetime-findmy-independent-20260916
    paths:
      - ".github/workflows/windows-facetime-findmy-fast-loop.yml"
      - "tooling/windows-cloudkit-build/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Must exactly equal the lane-pinned source SHA; any other value fails closed
        required: true
        type: string
      artifact_mode:
        description: Native DLL plus offline Dart test host, or the existing GUI harness
        required: true
        default: native-test-host
        type: choice
        options:
          - native-test-host
          - harness
      build_variant:
        description: Engineering harness configuration to compile; neither variant is run against CloudKit
        required: true
        default: local-write
        type: choice
        options:
          - local-write
          - read-only

permissions:
  contents: read

concurrency:
  group: windows-facetime-findmy-fast-loop
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref }}
  BUILD_VARIANT: ${{ inputs.build_variant }}
  ARTIFACT_MODE: ${{ inputs.artifact_mode }}
  LANE_SOURCE_SHA: 5ecd7abe849c22a2de3c024e471b6afc47af4b77

jobs:
  register:
    name: Register pilot workflow only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'Windows CloudKit fast-loop workflow registered; no source build ran.'

  build-and-smoke:
    name: Build and test Windows ARM64 CloudKit
    if: github.event_name == 'workflow_dispatch'
    # This is a fresh GitHub-hosted ARM64 VM. GitHub decommissions it after the
    # job, including timeout/cancellation, so there is no persistent runner or
    # GCE instance to delete from this bounded path.
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Validate exact reviewed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_ref must be a lowercase full 40-character commit SHA.'
          }
          if ($env:SOURCE_REF -cne $env:LANE_SOURCE_SHA) {
            throw 'source_ref is not the lane-pinned source SHA. No other ref is accepted.'
          }

      - name: Check out bounded sidecar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: sidecar
          persist-credentials: false

      - name: Check out reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Check source contracts before toolchain setup
        shell: pwsh
        run: |
          & ./sidecar/tooling/windows-cloudkit-build/build_and_smoke.ps1 `
            -SourceRoot ./source -ExpectedSourceCommit $env:SOURCE_REF `
            -SidecarCommit '${{ github.sha }}' -BuildVariant $env:BUILD_VARIANT `
            -ArtifactMode $env:ARTIFACT_MODE `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'windows-cloudkit-fast-loop') -ValidateOnly

      - name: Set up Flutter 3.44.8 archive
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.8
          architecture: x64
          # ARM bootstrap mutates the archive's x64 SDK. Do not save it under
          # a shared x64 cache identity for other Windows workflows.
          cache: false

      - name: Bootstrap native ARM64 Dart and Flutter engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = $env:FLUTTER_ROOT
          $updater = Join-Path $flutterRoot 'bin/internal/update_dart_sdk.ps1'
          if (-not (Test-Path -LiteralPath $updater -PathType Leaf)) {
            throw "Flutter SDK layout changed: $updater is absent."
          }
          Remove-Item -LiteralPath (Join-Path $flutterRoot 'bin/cache/engine-dart-sdk.stamp') -Force -ErrorAction SilentlyContinue
          & $updater
          Remove-Item -LiteralPath (Join-Path $flutterRoot 'bin/cache/flutter_tools.snapshot') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $flutterRoot 'bin/cache/flutter_tools.stamp') -Force -ErrorAction SilentlyContinue
          $dartVersion = & (Join-Path $flutterRoot 'bin/dart.bat') --version 2>&1 | Out-String
          if ($dartVersion -notmatch 'windows_arm64') {
            throw "Expected native ARM64 Dart, received: $dartVersion"
          }
          & (Join-Path $flutterRoot 'bin/flutter.bat') precache --windows
          if (-not (Test-Path -LiteralPath (
            Join-Path $flutterRoot 'bin/cache/artifacts/engine/windows-arm64'
          ) -PathType Container)) {
            throw 'Flutter did not install the Windows ARM64 engine.'
          }

      - name: Set up Rust ARM64 MSVC target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-pc-windows-msvc

      - name: Select native-only MSVC environment
        if: inputs.artifact_mode == 'native-test-host'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'ARM64 MSVC tools are unavailable.' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $sdkOutput = & $env:ComSpec /d /s /c "`"$devcmd`" -arch=arm64 -host_arch=arm64 -no_logo >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 MSVC initialization failed.' }
          $sdkPaths = @{}
          foreach ($line in $sdkOutput) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { $sdkPaths[$Matches[1]] = $Matches[2] }
          }
          $sdkOutput = $null
          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH')) {
            if (-not $sdkPaths[$name]) { throw "MSVC $name is missing." }
            "$name=$($sdkPaths[$name])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          # Keep MSVC ahead of GNU tools; OpenSSL still needs Strawberry Perl.
          $safePath = @($sdkPaths['PATH'] -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)\\Strawberry\\c\\bin' })
          $env:Path = $safePath -join ';'
          foreach ($tool in @('cl.exe', 'link.exe', 'clang.exe', 'perl.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing native tool: $tool" }
          }
          "PATH=$env:Path" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned Protocol Buffers compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '29.5'
          $expected = '633d3e555fc97f0a1f55b4adb03256cd94b8059e51e7abbae98ff39e58a9dfa5'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
          $destination = Join-Path $env:RUNNER_TOOL_CACHE "protoc\$version\x64"
          $uri = "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'protoc archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          (Join-Path $destination 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Supply pinned ARM64 ObjectBox runtime for database tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # flutter test loads ObjectBox before the Windows CMake build has
          # downloaded its bundled copy. Supply that same pinned C runtime
          # only on this ephemeral runner's PATH, never as a global install.
          $version = '5.3.2'
          $expected = 'e32ea12aebd76f00bcf9def941a3c73b24d2cc2dcd0e79a033b49522a2b2c0fd'
          $archive = Join-Path $env:RUNNER_TEMP "objectbox-windows-arm64-$version.zip"
          $destination = Join-Path $env:RUNNER_TOOL_CACHE "objectbox\$version\arm64"
          $uri = "https://github.com/objectbox/objectbox-c/releases/download/v$version/objectbox-windows-arm64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'ObjectBox archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $runtime = Join-Path $destination 'lib/objectbox.dll'
          $bytes = [System.IO.File]::ReadAllBytes($runtime)
          if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d) {
            throw 'ObjectBox runtime is not a PE binary.'
          }
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($pe -lt 64 -or $pe -gt ($bytes.Length - 6) -or
              [BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xaa64) {
            throw 'ObjectBox runtime is not Windows ARM64.'
          }
          "OPENBUBBLES_BUILD_OBJECTBOX_DLL=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $destination 'lib') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build, test, and package the executable loop
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'windows-cloudkit-fast-loop'
          & ./sidecar/tooling/windows-cloudkit-build/build_and_smoke.ps1 `
            -SourceRoot ./source `
            -ExpectedSourceCommit $env:SOURCE_REF `
            -SidecarCommit '${{ github.sha }}' `
            -BuildVariant $env:BUILD_VARIANT `
            -ArtifactMode $env:ARTIFACT_MODE `
            -OutputRoot $output

      - name: Upload short-lived engineering bundle and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cloudkit-fast-loop-arm64-${{ env.ARTIFACT_MODE }}-${{ env.BUILD_VARIANT }}-${{ env.SOURCE_REF }}
          path: |
            ${{ runner.temp }}/windows-cloudkit-fast-loop/*.zip
            ${{ runner.temp }}/windows-cloudkit-fast-loop/*.sha256
            ${{ runner.temp }}/windows-cloudkit-fast-loop/*.json
            ${{ runner.temp }}/windows-cloudkit-fast-loop/*.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cloudkit-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-cloudkit-fast-loop/*.log
          if-no-files-found: ignore
          retention-days: 3
