syntax = "proto3";

package openbubbles.cloudsync.outbound;

// Versioned native-only envelope for one outbound MessageEncryptedV3 record.
// It is encoded and platform-protected before any durable Dart-visible state
// is written. No instance of this protobuf crosses Flutter Rust Bridge.
message CloudSyncOutboundMessageV1 {
  uint32 schema_version = 1;
  bool has_utm = 2;
  int64 utm_seconds = 3;
  uint32 utm_nanos = 4;
  int64 message_type = 5;
  int64 error = 6;
  string chat_id = 7;
  string sender = 8;
  int64 time = 9;
  optional bytes msg_proto_2 = 10;
  string destination_caller_id = 11;
  bytes msg_proto = 12;
  int64 flags = 13;
  string guid = 14;
  optional bytes msg_proto_3 = 15;
  string service = 16;
  optional bytes msg_proto_4 = 17;
  string server_record_name = 18;
}

// Separate type AND protected-store purpose/zone from message envelopes. The
// original randomly allocated chat record name is immutable across retries.
message CloudSyncOutboundChatV1 {
  uint32 schema_version = 1;
  string server_record_name = 2;
  bytes chat_plist = 3;
}

// Separate type from message/chat envelopes. Native-only initial-create
// payload for one attachmentManateeZone record: the allocated random record
// name plus the completed attachment bytes. No instance of this protobuf
// crosses Flutter Rust Bridge.
message CloudSyncOutboundAttachmentV1 {
  uint32 schema_version = 1;
  string server_record_name = 2;
  bytes attachment_meta_plist = 3;
  bytes asset_proto = 4;
}

// Native-only pre-upload recovery material, protected under a different
// purpose from a completed attachment record. Contains encryption keys.
// Preparation is randomized: recovery must restore these exact bytes, not
// run prepare_put_v2 again. This is not permission to repeat an unknown upload.
message CloudSyncAttachmentUploadV1 {
  uint32 schema_version = 1;
  string parent_message_guid = 2;
  string parent_source_sha256 = 3;
  bytes record_identifier_proto = 4;
  bytes attachment_meta_plist = 5;
  bytes prepared_put_snapshot = 6;
  string source_file_sha256 = 7;
}
// Native-only IDS composer source: the provided pre-send MessageInst
// plus explicit ordered local attachment GUIDs paired to the
// actual Attachment parts. Inner snapshot is a canonical plist; no network
// authority and no stage. Protected staging wraps this envelope with the
// caller local source hash so the hash itself is protected.
message CloudSyncIdsAttachmentSourceV1 {
  uint32 schema_version = 1;
  bytes source_plist = 2;
}
// Protected wrapper staged under the idsAttachmentSource purpose: version
// plus caller local source hash plus the exact source envelope bytes.
message CloudSyncIdsAttachmentSourceStageV1 {
  uint32 schema_version = 1;
  string local_source_sha256 = 2;
  bytes source_envelope = 3;
}
