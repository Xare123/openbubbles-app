[package]
name = "corten-mac-validation-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Isolated historical Corten NAC qualification, not production OpenBubbles"

[workspace]

[dependencies]
base64 = "=0.21.7"
goblin = "0.10"
plist = "=1.7.0"
prost = "=0.12.6"
rand = "=0.8.5"
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1.0.134"
sha1 = "=0.10.6"
sha2 = "0.10.8"
# Pre-generated official bindings avoid a new libclang installation. Windows
# proof uses the existing x64 host toolchain; native ARM64 remains unqualified.
unicorn-engine = { version = "=2.1.3", default-features = false, features = ["arch_x86"] }

[build-dependencies]
prost-build = "=0.12.6"

[profile.dev]
debug = 0
incremental = false
